{% extends "base.html" %}
{% block title %}Feedback{% endblock %}

{% block content %}
<div class="form-page">
    <h1><i class="fas fa-comment-dots"></i> Send Feedback</h1>
    <form method="POST" class="facility-form">
        <div class="form-group">
            <label>Subject *</label>
            <input type="text" name="subject" required placeholder="Feedback subject">
        </div>
        <div class="form-group">
            <label>Message *</label>
            <textarea name="message" rows="5" required placeholder="Your feedback..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">
            <i class="fas fa-paper-plane"></i> Send Feedback
        </button>
    </form>
</div>
{% endblock %}
