{% extends "base.html" %}
{% block title %}Add Facility{% endblock %}

{% block content %}
<div class="form-page">
    <h1><i class="fas fa-plus-circle"></i> Add New Facility</h1>
    <form method="POST" class="facility-form">
        <div class="form-row">
            <div class="form-group">
                <label>Facility Name *</label>
                <input type="text" name="name" required placeholder="e.g., City Library">
            </div>
            <div class="form-group">
                <label>Category *</label>
                <select name="category" required>
                    <option value="">Select category</option>
                    <option>Library</option>
                    <option>Hospital</option>
                    <option>Shopping</option>
                    <option>Restaurant</option>
                    <option>Transport</option>
                    <option>Park</option>
                    <option>Hotel</option>
                    <option>Government Office</option>
                    <option>Other</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Address *</label>
                <input type="text" name="address" required placeholder="Street address">
            </div>
            <div class="form-group">
                <label>City *</label>
                <input type="text" name="city" required placeholder="City name">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Latitude</label>
                <input type="number" step="any" name="latitude" placeholder="e.g., 19.0760">
            </div>
            <div class="form-group">
                <label>Longitude</label>
                <input type="number" step="any" name="longitude" placeholder="e.g., 72.8777">
            </div>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="3" placeholder="Describe the facility..."></textarea>
        </div>

        <div class="form-group">
            <label>Accessibility Features</label>
            <div class="checkbox-grid">
                <label class="checkbox-item">
                    <input type="checkbox" name="wheelchair_accessible"> ♿ Wheelchair Accessible
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="has_ramp"> 🛗 Ramp Available
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="has_accessible_toilet"> 🚻 Accessible Toilet
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="has_elevator"> 🛗 Elevator
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="has_accessible_parking"> 🅿️ Accessible Parking
                </label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg">
            <i class="fas fa-save"></i> Add Facility
        </button>
    </form>
</div>
{% endblock %}
